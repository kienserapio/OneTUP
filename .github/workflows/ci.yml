name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` here. `packageManager` in package.json is the single
      # source of truth, and declaring it twice makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The web app needs env vars present to typecheck and build. These are
      # placeholders: CI never talks to the real project.
      - name: Write CI env
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://ci.supabase.co
          SUPABASE_PUBLISHABLE_KEY=ci-publishable
          SUPABASE_SERVICE_ROLE_KEY=ci-service-role
          SUPABASE_CONNECTION_STRING=postgresql://postgres:ci@db.ci.supabase.co:5432/postgres
          OPENROUTER_API_KEY=ci
          WORKER_SECRET=ci
          EOF
          node scripts/sync-env.mjs

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # The schema safeguards from 04-DATA-MODEL.md §17. A table without RLS, a
  # policy-less table, a view without security_invoker, or a column that looks
  # like a credential store fails the build rather than reaching production.
  schema:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A clone with no database secrets — a fork, or this repository before
      # anyone configures it — skips the check rather than failing it. A red
      # badge that means "unconfigured" teaches contributors to ignore the
      # badge, which is worse than not running the check.
      - name: Write env
        id: env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_CONNECTION_STRING" ]; then
            echo "::notice::No Supabase secrets on this repository — skipping the schema safeguards."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_CONNECTION_STRING=$SUPABASE_CONNECTION_STRING"
            echo "SUPABASE_POOLER_HOST=$SUPABASE_POOLER_HOST"
          } > .env
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - if: steps.env.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - if: steps.env.outputs.configured == 'true'
        run: node scripts/db.mjs check
