name: Bug report
description: Something in OneTUP does not work the way it should
title: "fix: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A reproduction we can follow is worth more
        than a perfect description.

        **Found a security problem?** Do not file it here — see
        [SECURITY.md](https://github.com/kienserapio/OneTUP/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see?
      placeholder: The Today screen showed yesterday's class after I imported a new schedule.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number them. Start from a signed-out state if you can.
      placeholder: |
        1. Sign in
        2. Go to Schedule → Import → Paste
        3. Paste the schedule below
        4. Open Today
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Today
        - Schedule / import
        - Attendance
        - Grades / GWA
        - Deadlines
        - Announcements
        - Commute
        - Campus map or tour
        - Assistant
        - Settings / account
        - Landing page or docs
        - Offline behaviour
        - Not sure
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 13, Safari 18 — or Windows 11, Chrome 130
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How were you using it
      options:
        - In a browser tab
        - Installed to the home screen (PWA)
        - Running it locally with pnpm dev
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors, if any
      description: DevTools → Console. Paste the error, not a screenshot of it.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: |
        Blur or remove anything identifying — your name, student number, or
        another person's grades. Never paste real credentials.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed any personal data from what I pasted above
          required: true
